<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Cantinho — folha de sprites</title>
<style>body{background:#3a3346;color:#f1e4c6;font:11px monospace;margin:10px}canvas{image-rendering:pixelated}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}.cell{display:flex;flex-direction:column;align-items:center;background:#4a4258;padding:4px}</style></head>
<body><div id="err"></div><div class="row" id="furni"></div>
<script type="module">
import { FURNI } from '../src/furniture.js';
import { furniSprite } from '../src/sprites.js';
const q = new URLSearchParams(location.search);
const S = +(q.get('s') || 2);
const only = q.get('only'), cat = q.get('cat');
const show = (canvas, label) => {
  const d = document.createElement('div'); d.className = 'cell';
  const c = document.createElement('canvas'); c.width = canvas.width * S; c.height = canvas.height * S;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(canvas, 0, 0, c.width, c.height);
  d.append(c, label); document.getElementById('furni').append(d);
};
const t0 = performance.now();
for (const def of Object.values(FURNI)) {
  if (only && !only.split(',').includes(def.id)) continue;
  if (cat && def.cat !== cat) continue;
  const n = q.has('states') && def.states ? def.states.length : 1;
  const rots = q.has('rots') ? (def.wall ? 2 : (def.rots || 4)) : 1;
  for (let st = 0; st < n; st++) for (let rot = 0; rot < rots; rot++) {
    try { show(furniSprite(def, { rot, state: def.states && !q.has('states') ? (def.light || def.frames ? 1 : 0) : st, env: q.get('env') || 'day', nb: +(q.get('nb') || 0), time: { h: 10, m: 10 } }).canvas, def.id + (st ? ' s' + st : '') + (rot ? ' r' + rot : '')); }
    catch (e) { document.getElementById('err').textContent += ' ' + def.id + ': ' + e.message; console.error(e); }
  }
}
console.log('ms', Math.round(performance.now() - t0));
</script></body></html>
